name: Deploy (Telegram Serverless)

on:
  push:
    branches: [main]
    paths:
      - "tgcloud/**"
      - "tgcloud.jsonc"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      migrate_mode:
        description: "Migração do banco: safe (só mudanças aditivas) ou dry-run (só mostra)."
        type: choice
        options: [safe, dry-run]
        default: safe

concurrency:
  group: tgcloud-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verificar secret
        run: |
          if [ -z "$TGCLOUD_TOKEN" ]; then
            echo "::error::Defina o secret TGCLOUD_TOKEN (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - run: npm ci

      - name: Sincronizar estado da nuvem
        run: npx --no-install tgcloud fetch

      - name: Injetar segredos no módulo do bot
        env:
          GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_DISPATCH_TOKEN" ]; then
            echo "::error::Defina o secret GH_DISPATCH_TOKEN (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          node -e "require('fs').writeFileSync('tgcloud/lib/segredos.js', 'export const GH_DISPATCH_TOKEN = ' + JSON.stringify(process.env.GH_DISPATCH_TOKEN) + ';\n')"

      - name: Mudanças a publicar
        run: npx --no-install tgcloud status

      - name: Migrar banco
        run: |
          mode="${{ github.event.inputs.migrate_mode || 'safe' }}"
          case "$mode" in
            dry-run) npx --no-install tgcloud migrate --dry-run --local ;;
            *)       npx --no-install tgcloud migrate --safe --local ;;
          esac

      - name: Publicar módulos
        run: npx --no-install tgcloud push

      - name: Estado do webhook
        run: npx --no-install tgcloud webhook

      - name: Validar a permissão do GH_DISPATCH_TOKEN
        env:
          GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
        run: |
          status=$(curl -sS -m 20 -o "$RUNNER_TEMP/validacao.json" -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $GH_DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d '{"ref":"main","inputs":{}}' \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/resolver.yml/dispatches")
          case "$status" in
            422|204)
              echo "GH_DISPATCH_TOKEN pode disparar o resolver.yml (HTTP $status; o teste vai sem a entrada obrigatória)."
              ;;
            401|403|404)
              echo "::error::GH_DISPATCH_TOKEN não pode disparar o resolver.yml (HTTP $status). O token precisa da permissão Actions: Read and write neste repositório. Os módulos já foram publicados; a busca por MTProto fica indisponível até o token ser corrigido."
              cat "$RUNNER_TEMP/validacao.json"
              exit 1
              ;;
            *)
              echo "::error::Resposta inesperada do GitHub ao validar o token (HTTP $status)."
              cat "$RUNNER_TEMP/validacao.json"
              exit 1
              ;;
          esac
