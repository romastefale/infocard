name: Deploy (Telegram Serverless)

# Cada push em main que altera o código do bot publica os módulos (`tgcloud push`)
# e aplica migrações seguras. Requer o secret ACCESS_TOKEN (BotFather → bot →
# Serverless → CLI Access → Access token, formato app<id>:<secret>). NÃO é o token
# da Bot API. O CLI oficial só lê a variável TGCLOUD_TOKEN (documentação,
# "Authentication"), então o secret é mapeado para ela em `env` abaixo.

on:
  push:
    branches: [main]
    paths:
      - "tgcloud/**"
      - "tgcloud.jsonc"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      migrate_mode:
        description: "Migração do banco: safe (só mudanças aditivas) ou dry-run (só mostra)."
        type: choice
        options: [safe, dry-run]
        default: safe

concurrency:
  group: tgcloud-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TGCLOUD_TOKEN: ${{ secrets.ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verificar secret
        run: |
          if [ -z "$TGCLOUD_TOKEN" ]; then
            echo "::error::Defina o secret ACCESS_TOKEN (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      # CLI oficial @tgcloud/cli, local (versão do lockfile). `npx --no-install` nunca
      # baixa nada do registro, então um pacote avulso chamado `tgcloud` não pode entrar no lugar.
      - run: npm ci

      # O estado local (.tgcloud/) não existe no runner; `fetch` baixa o estado da nuvem
      # para que o `push` saiba em qual revisão está se baseando.
      - name: Sincronizar estado da nuvem
        run: npx --no-install tgcloud fetch

      - name: Mudanças a publicar
        run: npx --no-install tgcloud status

      - name: Publicar módulos
        run: npx --no-install tgcloud push

      # `migrate` sem flag exige terminal interativo. Em CI usamos --safe
      # (aplica só mudanças aditivas e ignora as destrutivas). Sem --yes de propósito.
      - name: Migrar banco
        run: |
          mode="${{ github.event.inputs.migrate_mode || 'safe' }}"
          case "$mode" in
            dry-run) npx --no-install tgcloud migrate --dry-run ;;
            *)       npx --no-install tgcloud migrate --safe ;;
          esac

      - name: Estado do webhook
        run: npx --no-install tgcloud webhook
