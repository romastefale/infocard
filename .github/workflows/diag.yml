name: Diagnóstico de capacidades na plataforma

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx --no-install tgcloud fetch
      - name: Capacidades
        run: |
          mkdir -p tgcloud/endpoints
          cp scripts/probe-capacidades.js tgcloud/endpoints/probe.js
          npx --no-install tgcloud run endpoints/probe '{}'
