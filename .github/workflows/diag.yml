name: Diagnóstico na plataforma (tgcloud run)

on:
  workflow_dispatch:
    inputs:
      texto:
        description: "Texto a enviar aos handlers"
        required: true
        default: "@telegram"
      chat:
        description: "ID do chat de destino do handlers/message"
        required: true
        default: "1"

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
      TEXTO: ${{ inputs.texto }}
      CHAT: ${{ inputs.chat }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx --no-install tgcloud fetch
      - name: handlers/message
        continue-on-error: true
        run: |
          npx --no-install tgcloud run handlers/message "{ chat: { id: $CHAT, type: 'private' }, text: '$TEXTO' }"
      - name: handlers/inline_query
        continue-on-error: true
        run: |
          npx --no-install tgcloud run handlers/inline_query "{ id: 'diag', query: '$TEXTO' }"
